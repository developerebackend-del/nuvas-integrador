[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvas-integrador"
version = "0.1.0"
description = "Proyecto de limpieza de datos (HU1) con pandas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.0.1",
  "python-dotenv==1.2.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
